<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body{
          background-color: white;
          margin: 0;
          padding: 0 0 420px;
          box-sizing: border-box;
          min-height: 100vh;
        }

        @media (min-width: 980px) {
          body {
            background: linear-gradient(180deg, #f8f8f8 0%, #f2f2f2 100%);
          }

          .header {
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 0 0 18px 18px;
          }

          .feed-posts {
            max-width: 560px;
            margin: 16px auto 0;
            padding-right: 0;
          }

          .post-thread {
            max-width: 540px;
          }

          .sidemenu {
            left: auto;
            right: 0;
            width: 250px;
            border-right: none;
            border-left: 1px solid rgba(177, 151, 252, 0.5);
            box-shadow: -8px 0 24px rgba(0, 0, 0, 0.2);
          }

          .closebtn {
            display: none !important;
          }
        }
            

        body::-webkit-scrollbar{
            display: none;
        }

        .announcement{
          background-color: yellow;
          color: black;
          width: 100%;
          
          
         
          
        
          font-weight: 600;
          display: inline-block;
        }

        .announcement-text {
          margin: 10px 6px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          line-height: 1.4;
          flex-wrap: wrap;
        }

        .announcement-text-preview {
          display: inline;
          white-space: normal;
          flex: 1 1 auto;
          min-width: 0;
        }


        

        .header{
           background-color: white;
            background-size: cover;
            background-position: center;
            left: 0;
            top: 0;
            position: relative;
            padding: 18px 12px;
            font-size: 12px;
            font-family:'Times New Roman', Times, serif;
            overflow: hidden;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px solid transparent;
          
            

            border-bottom-left-radius: 12px;
           border-bottom-right-radius: 12px;
                 
           }

        .header::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background-color: rgb(187, 184, 184);
          
        }

        .title-wrap{
          
            display: flex;
            align-items: center;
            position: absolute;
            left: 44%;
            
            margin-top: -10px;
            
        }

      

        .title-wrap i {
            font-size: 1.8rem;
            line-height: 1;
        }

        .title{
            color: rgb(249, 245, 3);
            letter-spacing: 5px;
            font-weight: 900;
            font-size: 22px;
            font-family: comic sans ms, sans-serif;
            
            text-shadow: 2px 2px 0 #000, 4px 4px 0 rgba(0, 0, 0, 0.35);
            transform: skewX(-6deg);
            display: inline-block;
        }

        .header-brand-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin-right: auto;
            margin-left: 4px;
            background: rgba(255, 255, 255, 0.08);
            border: 1.2px solid rgb(123, 122, 122);
            border-radius: 10px;
            box-shadow: inset 0 1px 0 rgba(120, 119, 119, 0.12), 0 2px 8px rgba(0,0,0,0.18);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .header-icons{
          margin-left: auto;
          margin-right: -7px;
            display: flex;
            align-items: center;
            justify-content: center;
            
            float: right;
            border-radius: 12px;
            padding: 6px 10px;
            gap: 12px;
            margin-top: -6px;
           
            height: 30px;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .header-icons i,
        .header-icons .openbtn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin: 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1.2px solid rgb(72, 71, 71);
            border-radius: 10px;
            box-shadow: inset 0 1px 0 rgba(12, 12, 12, 0.12), 0 2px 8px rgba(0,0,0,0.18);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        #searchBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin: 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1.2px solid rgb(72, 71, 71);
            border-radius: 10px;
            box-shadow: inset 0 1px 0 rgba(12, 12, 12, 0.12), 0 2px 8px rgba(0,0,0,0.18);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .header-icons .openbtn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 0;
            cursor: pointer;
        }

        .header-icons i:hover,
        .header-icons .openbtn:hover,
        #searchBtn:hover {
            transform: translateY(-1px) scale(1.04);
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.28);
        }

       

/*notification css*/

        .notification-bell {
  position: relative;
  display: inline-block;
}

.notify-bubble {
  position: absolute;
  top: -6px;
  right: -6px;
  background: red;
  color: white;
  font-size: 12px;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 50%;
  display: none;
  z-index: 9999;
  font-family: 'Roboto', sans-serif;
}


#notifyBell {
  cursor: pointer;
  transition: transform 0.2s ease;
}

#notifyBell:hover {
  transform: scale(1.15);
}

/* search css */

.sheet {
  position: fixed;
  left: 0;
  bottom: -100%;
  width: 100%;
  height: 100%;
  background: white;
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
  transition: bottom 0.35s ease;
  z-index: 9999;
  overflow: hidden;
  border: 2.5px solid #060606;
}

.sheet.show {
  bottom: 0;
}

.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  flex-shrink: 0;
  background: transparent;
  border: none;
  box-shadow: none;
}

.close-btn {
  background: transparent;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: #111;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.sheet-content {
  padding: 20px;
  margin-top: -60px;
  height: calc(100% - 54px);
  overflow-y: auto;
  overflow-x: hidden;
  box-sizing: border-box;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.sheet-content::-webkit-scrollbar {
  display: none;
}

#searchInput {
  width: 95%;
  padding: 14px 12px;
  font-size: 17px;
  border-radius: 14px;
  border: 2.5px solid #060606;
  outline: none;
  background: #faf7ff;
  color: #414141;
}


#searchInput::placeholder {
  font-size: 16px;
  color: rgb(17, 17, 18);
  opacity: 1;
  font-style: italic;

}

#searchInput:focus {
  border: 2px solid transparent;
  background:
    linear-gradient(#faf7ff, #faf7ff) padding-box,
    linear-gradient(90deg, #ffeb3b, #ff4d4d, #3b82f6, #22c55e, #f59e0b, #8b5cf6, #ec4899) border-box;
  background-size: 200% 200%;
  animation: borderFlow 2.5s linear infinite;
}

@keyframes borderFlow {
  0% {
    background-position: 0% 50%;
  }
  100% {
    background-position: 200% 50%;
  }
}

.search-video-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(120px, 1fr));
  gap: 10px;
  padding: 0 10px 16px;
  align-items: start;
}

.search-post-card {
  background: rgb(190, 189, 189);
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
  width: 100%;
  min-width: 0;
}

.search-post-card video,
.search-post-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
  background: #000;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
}

.search-post-card .search-caption-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px 10px;
}

.search-post-card .search-user-avatar {
  width: 26px;
  height: 26px;
  min-width: 26px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(239, 251, 9, 0.984);
  background: linear-gradient(135deg, rgba(177, 151, 252, 0.18), rgba(255, 255, 255, 0.9));
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
  cursor: pointer;
  padding: 0;
}

.search-post-card .search-user-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.search-post-card .search-user-avatar i {
  font-size: 16px;
  line-height: 1;
}

.search-post-card .search-caption {
  font-size: 16px;
  line-height: 1.35;
  font-weight: 500;
  color: #000000;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  flex: 1;
  padding: 0;
  margin: 0;
}


.sheet-drag {
  width: 45px;
  height: 6px;
  background: turquoise;
  border-radius: 10px;
  display: block;
  margin: 0 auto;
  animation: dragPulse 1.8s infinite ease-in-out;
}

@keyframes dragPulse {
  0% { transform: translateY(0); opacity: 0.7; }
  50% { transform: translateY(-4px); opacity: 1; }
  100% { transform: translateY(0); opacity: 0.7; }
}

 border: 1.5px solid rgb(197, 196, 196);

        .sidemenu {

    width: 0;
