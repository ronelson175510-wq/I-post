<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bookme">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./app-icon.svg">
    <title>Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="script.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100%;
            padding: 0;
        }

        .reelpage-header {
            position: fixed;
            top: 10px;
            left: 12px;
            right: 12px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 42px;
            padding: 0 12px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 30px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.22);
            backdrop-filter: blur(18px) saturate(170%);
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            background-clip: padding-box;
        }

        .reel-back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.14);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .reel-back-btn:hover,
        .reel-back-btn:focus-visible {
            transform: translateY(-1px) scale(1.04);
            background: rgba(255, 255, 255, 0.16);
            outline: none;
        }

        .header-icons {
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 6px 8px;
            border-radius: 12px;
            background: rgba(0,0,0,0.10);
        }

        .header-icons i,
        .header-icons .openbtn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin: 0;
            
            
            border-radius: 10px;
           
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .header-icons i:hover,
        .header-icons .openbtn:hover {
            transform: translateY(-1px) scale(1.04);
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.28);
        }

        .sheet {
            position: fixed;
            left: 0;
            bottom: -100%;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
            transition: bottom 0.35s ease;
            z-index: 9999;
            overflow: hidden;
            
        }

        .sheet.show {
            bottom: 0;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            flex-shrink: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #000;
        }

        .sheet-content {
            padding: 20px;
            margin-top: -60px;
            height: calc(100% - 54px);
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .sheet-content::-webkit-scrollbar {
            display: none;
        }

        #searchInput {
            width: 95%;
            padding: 14px 12px;
            font-size: 17px;
            border-radius: 14px;
            border: 1.5px solid rgba(0, 0, 0, 0.08);
            outline: none;
            background: #faf7ff;
            color: #414141;
        }

        #searchInput::placeholder {
            font-size: 16px;
            color: rgb(17, 17, 18);
            opacity: 1;
            font-style: italic;
        }

        #searchInput:focus {
            border: 2px solid transparent;
            background:
                linear-gradient(#faf7ff, #faf7ff) padding-box,
                linear-gradient(90deg, #ffeb3b, #ff4d4d, #3b82f6, #22c55e, #f59e0b, #8b5cf6, #ec4899) border-box;
            background-size: 200% 200%;
            animation: borderFlow 2.5s linear infinite;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .search-video-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(120px, 1fr));
            gap: 10px;
            padding: 0 10px 16px;
            align-items: start;
        }

        .search-user-results-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 10px 12px;
        }

        .search-user-result {
            width: 100%;
            min-width: 0;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 8px 10px;
            text-align: left;
        }

        .search-post-card {
            background: rgb(190, 189, 189);
            
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            width: 100%;
            min-width: 0;
        }

        .search-post-card video,
        .search-post-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: #000;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .search-post-card .search-caption-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 10px 10px;
        }

        .search-post-card .search-user-avatar {
            width: 26px;
            height: 26px;
            min-width: 26px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(239, 251, 9, 0.984);
            background: linear-gradient(135deg, rgba(177, 151, 252, 0.18), rgba(255, 255, 255, 0.9));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            cursor: pointer;
            padding: 0;
        }

        .search-post-card .search-user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .search-post-card .search-user-avatar i {
            font-size: 16px;
            line-height: 1;
        }

        .search-post-card .search-caption {
            font-size: 16px;
            line-height: 1.35;
            font-weight: 500;
            color: #000000;
            word-break: break-word;
        }

        .reels-container {
            width: 100%;
            height: 100vh;
            background: transparent;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
            touch-action: pan-y;
            padding-top: 0;
            margin-top: 0;
        }

        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                background: #111;
            }

            .reels-container {
                width: min(100%, 440px);
                max-width: 440px;
                margin: 0 auto;
                border-left: 1px solid rgba(255,255,255,0.08);
                border-right: 1px solid rgba(255,255,255,0.08);
            }

            .reel-item {
                width: 100%;
                max-width: 440px;
                margin: 0 auto;
            }
        }

        .reels-container::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }

        .reel-item {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            scroll-snap-align: start;
        }

        .reel-item .video-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .reel-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .video-toggle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: rgba(17, 17, 17, 0.7);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            z-index: 2;
        }

        .video-meta {
            position: absolute;
            top: 64px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2;
        }

        .video-progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: rgba(255,255,255,0.12);
            overflow: hidden;
            z-index: 3;
            cursor: pointer;
        }

        .video-progress-bar {
            display: block;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffff05 90%, #fffb04 100%);
            transition: width 0.12s linear;
        }

        .video-tag,
        .video-timer {
            background: rgba(17, 17, 17, 0.56);
            color: #fff;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            backdrop-filter: blur(3px);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        .video-tag {
            position: static;
        }

        .video-timer {
            position: static;
        }

        .reel-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px 16px 18px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.72));
            pointer-events: none;
        }

        .reel-actions {
            position: absolute;
            right: 12px;
            bottom: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 4;
            pointer-events: auto;
        }

        .reel-action-btn {
            width: 62px;
            height: auto;
            min-height: 62px;
            
            background: none;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
           
        border-radius: 20px;
        border:1.4px solid rgba(255, 255, 255, 0.18);
        }

        .reel-action-btn:active {
            transform: scale(0.96);
        }

        .reel-action-btn i {
            font-size: 18px;
            line-height: 1;
        }

        .reel-action-count {
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
            color: #2b2b2b;
            min-width: 18px;
            color: #fff;
            letter-spacing: 0.02em;
        }

        .reel-user-row,
        .reel-caption,
        .reel-read-more-btn {
            pointer-events: auto;
        }

        .reel-user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: -95px;
            margin-left: -8px;
        }

        .reel-user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.12);
            flex-shrink: 0;
        }

        .reel-user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .reel-user-name {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 550px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .reel-user-name .verified-user-badge {
            width: 15px;
            height: 15px;
            min-width: 15px;
            min-height: 15px;
            border-radius: 50%;
            background: none;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            vertical-align: middle;
        }

        .reel-user-name .verified-user-badge svg {
            width: 30px;
            height: 30px;
            display: block;
            stroke-width: 2.5;
        }

        .reel-caption {
            margin: 8px 0 0;
            width: 90%;
            font-weight: 640;
            color: #ffffff;
            line-height: 1.5;
            font-size: 16px;
            
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: block;
            text-align: left;
            white-space: normal;
            position: relative;
            z-index: 1;
        }

        .reel-caption-text {
            display: inline;
            white-space: normal;
            color: #ffffff;
            line-height: 1.7;
            text-align: left;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .reel-read-more-btn {
            appearance: none;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.82);
            font-weight: 700;
            padding: 0;
            margin-left: 2px;
            margin-top: 0;
            cursor: pointer;
            font-size: 0.78rem;
            line-height: 1.2;
            border-radius: 0;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            transition: opacity 0.18s ease;
            display: inline;
            vertical-align: baseline;
        }

        .reel-read-more-btn:hover,
        .reel-read-more-btn:focus-visible {
            opacity: 0.8;
            outline: none;
        }

        .reel-caption.expanded .reel-caption-text {
            white-space: normal;
        }

        .reel-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 60px);
            color: rgba(255,255,255,0.7);
            font-size: 16px;
            padding: 24px;
            text-align: center;
        }

        .search-btn {
            float: right;
        }

        body.dark-mode .comments-sheet {
            background: #111827;
            color: #f3f4f6;
            border-top-color: rgba(255, 255, 255, 0.08);
        }

        body.dark-mode .comments-sheet .comments-header h3,
        body.dark-mode .comments-sheet .comment-empty,
        body.dark-mode .comments-sheet .comment-text,
        body.dark-mode .comments-sheet .comment-user-meta strong,
        body.dark-mode .comments-sheet .comment-date {
            color: #f3f4f6;
        }

        body.dark-mode .comments-sheet .comment-input-wrap {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.12);
        }

        body.dark-mode .comments-sheet .comment-input {
            background: transparent;
            color: #f3f4f6;
        }

        body.dark-mode .comments-sheet .comment-input::placeholder {
            color: #c7d2fe;
        }

        body.dark-mode .comments-sheet .comment-item {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.08);
            color: #f3f4f6;
        }

        body.dark-mode .comments-sheet .comment-thread.is-reply .comment-item {
            background: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .comments-sheet .comment-action-btn {
            color: #d1d5db;
        }

        body.dark-mode .comments-sheet #submitCommentBtn {
            background: #f3f4f6;
            color: #111827;
        }

        .comments-sheet {
            position: fixed;
            left: 0;
            bottom: -100%;
            width: 100%;
            height: 99%;
            background: white;
            border-radius: 20px 20px 0 0;
            border-top: 1.5px solid rgba(0, 0, 0, 0.08);
            transition: bottom 0.35s ease;
            z-index: 9999;
        }

        .comments-sheet.show {
            bottom: 0;
        }

        .comments-sheet .sheet-header {
            display: flex;
            position: relative;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px 0;
        }

        .comments-sheet .sheet-drag {
            width: 44px;
            height: 5px;
            border-radius: 999px;
            background: #d0c2ff;
            display: block;
            margin: 0 auto;
            position: absolute;
            left: 50%;
            top: 10px;
            transform: translateX(-50%);
        }

        .comments-sheet .close-btn {
            position: absolute;
            right: 16px;
            top: 8px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #000;
        }

        .comments-sheet-content {
            padding: 12px 18px 18px;
            height: calc(100% - 52px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        .comments-header {
            display: flex;
            align-items: center;
            text-align: center;
            margin-top: 8px;
            justify-content: center;
        }

        .comments-header h3 {
            margin: 0;
            color: #1d1d1d;
            font-size: 20px;
        }

        .comment-composer {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            margin-top: auto;
            margin-bottom: 20px;
        }

        .comment-input-wrap {
            position: relative;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid rgba(8, 8, 8, 0.1);
            border-radius: 16px;
            background: #fdfbfb;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
        }

        .comment-input {
            
            width: 100%;
            box-sizing: border-box;
            min-height: 22px;
            max-height: 80px;
            resize: none;
            border: none;
            border-radius: 12px;
            padding: 10px 6px 8px 4px;
            font-size: 14px;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: transparent;
            color: #1a1a1a;
            outline: none;
        }

        .comment-input::placeholder {
            color: #6d6d6d;
        }

        #submitCommentBtn {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: linear-gradient(180deg, #151515 0%, #080808 100%);
            color: white;
            cursor: pointer;
            align-self: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(17, 17, 17, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        #submitCommentBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(17, 17, 17, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            filter: brightness(1.05);
        }

        #submitCommentBtn:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(17, 17, 17, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        #submitCommentBtn i {
            font-size: 1.05rem;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -ms-overflow-style: none;
            scrollbar-width: none;
            padding-right: 4px;
        }

        .comments-list::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }

        .comment-item {
            background: none;
            margin-left: -12px;
            padding: 10px 12px;
            color: #0a0a0a;
            font-size: 16px;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-weight: 500;
            line-height: 1.5;
            border-radius: 10px;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            cursor: pointer;
        }

        .comment-item:hover {
            background: rgba(144, 127, 255, 0.04);
        }

        .comment-item.replying {
            background: rgba(144, 127, 255, 0.08);
            border: 1px solid rgba(144, 127, 255, 0.28);
        }

        .comment-thread {
            display: block;
        }

        .comment-thread.is-reply {
            margin-top: 8px;
        }

        .comment-replies {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            margin-left: 18px;
            padding-left: 12px;
            border-left: 2px solid rgba(122, 108, 255, 0.18);
            position: relative;
        }

        .comment-item.is-reply-item {
            background: rgba(144, 127, 255, 0.025);
            border: 1px solid rgba(144, 127, 255, 0.08);
            padding: 8px 10px 10px;
        }

        .comment-user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .comment-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, #e9ddff, #d9ecff);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }

        .comment-avatar img,
        .comment-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .comment-avatar-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #070707;
            font-size: 16px;
        }

        .comment-user-meta {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex-wrap: wrap;
            cursor: pointer;
        }

        .comment-user-line {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            line-height: 1.2;
        }
