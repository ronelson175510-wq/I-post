
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #2a1f42 0%, #120f1c 30%, #050507 100%);
            font-family: Arial, sans-serif;
            color: #f5f5f5;
        }

        .login-container {
            width: min(360px, calc(100vw - 32px));
            padding: 30px 24px 22px;
            border-radius: 24px;
            background: rgba(17, 17, 23, 0.85);
            border: 1px solid rgba(177, 151, 252, 0.4);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .login-container h2 {
            margin-bottom: 22px;
            color: #f3f0ff;
            font-size: 28px;
            letter-spacing: 0.5px;
        }

        .login-container input {
            width: 100%;
            padding: 14px 14px;
            margin-top: 12px;
            border-radius: 12px;
            border: 1px solid rgba(177, 151, 252, 0.35);
            background: rgba(255, 255, 255, 0.04);
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .login-container input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .login-container input:focus {
            border-color: #b79aff;
            box-shadow: 0 0 0 3px rgba(183, 154, 255, 0.18);
        }

        .login-container button {
            width: 100%;
            padding: 13px 12px;
            margin-top: 16px;
            border-radius: 12px;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 22px rgba(124, 58, 237, 0.28);
        }

        .login-container button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(124, 58, 237, 0.36);
        }

        .login-container a {
            display: inline-block;
            margin-top: 18px;
            color: #d9c8ff;
            text-decoration: none;
            font-size: 14px;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        /* Signup Overlay */
        #signupOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 8, 12, 0.7);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }

        /* Signup Modal */
        #signupSlides {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(360px, calc(100vw - 28px));
            max-height: 500px;
            background: rgba(16, 16, 22, 0.96);
            border: 1px solid rgba(177, 151, 252, 0.5);
            padding: 40px 24px 26px;
            border-radius: 22px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.45);
            z-index: 1000;
            display: none;
        }

        /* Close button */
        #closeSignup {
            position: absolute;
            top: 15px;
            right: 18px;
            font-size: 28px;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
        }

        #closeSignup:hover {
            color: #fff;
        }

        /* Slide */
        .slide {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .slide.activeSlide {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .slide h2 {
            margin-bottom: 20px;
            color: #f3f0ff;
        }

        .slide input,
        .slide select {
            width: 100%;
            padding: 12px 14px;
            margin-top: 12px;
            border: 1px solid rgba(177, 151, 252, 0.35);
            border-radius: 12px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: white;
            outline: none;
        }

        .password-wrap {
            position: relative;
            margin-top: 12px;
            width: 100%;
        }

        .password-wrap input {
            margin-top: 0;
            padding-right: 42px;
            width: 100%;
        }

        .password-wrap .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            left: auto;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            width: 22px;
            min-width: 22px;
            height: 22px;
            border-radius: 6px;
            box-shadow: none;
            outline: none;
            z-index: 2;
            margin: 0;
            flex: none;
        }

        .login-password-wrap {
            margin-top: 12px;
        }

        .slide input::placeholder,
        .slide select {
            color: rgba(255, 255, 255, 0.7);
        }

        .slide button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: black;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 10px 22px rgba(124, 58, 237, 0.22);
        }

        .slide button:hover {
             background: black;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .button-group button {
            flex: 1;
        }

        #loginMessage {
            color: red;
            margin-top: 15px;
            font-size: 14px;
        }

        /* Profile Picture Slide Styles */
        .profile-pic-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .profile-pic-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 100%);
            border: 3px dashed #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .profile-pic-placeholder:hover {
            background: linear-gradient(135deg, #d0d0d0 0%, #e8e8e8 100%);
            border-color: #007bff;
        }

        .profile-pic-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #profilePicInput {
            display: none;
        }

        .profile-pic-label {
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .profile-pic-label strong {
            color: #007bff;
            cursor: pointer;
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div id="signupOverlay" onclick="closeSignupSlides()"></div>

    <div id="signupSlides" onclick="event.stopPropagation()">
        <div id="closeSignup" onclick="closeSignupSlides()">✖</div>

        <!-- Slide 1 -->
        <div class="slide activeSlide" id="slide1">
            <h2>Create Account</h2>
            <input id="nameInput" placeholder="Full Name">
            <input id="emailInput" placeholder="Email">
            <div class="password-wrap">
                <input id="passwordInput" type="password" placeholder="Password">
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Show passwords" style="background: none; border: none; cursor: pointer;">👁️</button>
            </div>
            <button onclick="nextSlide(2)">Next →</button>
        </div>

        <!-- Slide 2 -->
        <div class="slide" id="slide2">
            <h2>Verify your email</h2>
            <p style="color: rgba(255,255,255,0.75); margin-bottom: 12px; font-size: 14px; text-align: center; line-height: 1.5;">
                We sent a verification code to your email. Enter it below to continue.
            </p>
            <input id="verifyCodeInput" placeholder="Enter verification code">
            <div class="button-group">
                <button onclick="nextSlide(1)">← Back</button>
                <button onclick="nextSlide(3)">Next →</button>
            </div>
        </div>

        <!-- Slide 3 -->
        <div class="slide" id="slide3">
            <h2>Personal Info</h2>
            <select id="sexInput">
                <option value="">Select Sex</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <input id="dobInput" type="date">
            <div class="button-group">
                <button onclick="nextSlide(2)">← Back</button>
                <button onclick="nextSlide(4)">Next →</button>
            </div>
        </div>

        <!-- Slide 4 -->
        <div class="slide" id="slide4">
            <h2>Profile Picture</h2>
            <div class="profile-pic-section">
                <div class="profile-pic-placeholder" id="profilePicPlaceholder" onclick="document.getElementById('profilePicInput').click()">
                    👤
                </div>
                <p class="profile-pic-label">
                    Click the circle or <strong onclick="document.getElementById('profilePicInput').click()">browse</strong> to upload
                </p>
                <input id="profilePicInput" type="file" accept="image/*" onchange="previewProfilePic()">
            </div>
            <div class="button-group" style="margin-top: 30px;">
                <button onclick="nextSlide(3)">← Back</button>
                <button onclick="finishSignup()">Finish</button>
            </div>
        </div>
    </div>

    <div class="login-container">
        <h2>Welcome to Myspot</h2>

        <input id="loginEmail" type="email" placeholder="Email">
        <div class="password-wrap login-password-wrap">
            <input id="loginPassword" type="password" placeholder="Password">
            <button type="button" class="toggle-password login-toggle-password" onclick="toggleLoginPasswordVisibility()" aria-label="Show password">👁️</button>
        </div>

        <button id="loginBtn">Log In 
        </button>  
        <button onclick="showSignupSlides()">Sign Up</button>
        <a href="" style="margin-bottom: 62px;">Forgot Password?</a>

        <p id="loginMessage"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBAnPo7WP5SeFoz-hSKWil6v0tWI1oUeCw",
            authDomain: "my-book-d3907.firebaseapp.com",
            projectId: "my-book-d3907",
            storageBucket: "my-book-d3907.firebasestorage.app",
            messagingSenderId: "376744576799",
            appId: "1:376744576799:web:f913314bbe68364f8b522a",
            measurementId: "G-M8PGSMBP97"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const loginBtn = document.getElementById("loginBtn");
        const loginMessage = document.getElementById("loginMessage");

        // Login
        loginBtn.addEventListener("click", () => {
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = "index.html";
                })
                .catch(err => {
                    switch (err.code) {
                        case "auth/invalid-email":
                            loginMessage.textContent = "Invalid email address.";
                            break;
                        case "auth/user-not-found":
                            loginMessage.textContent = "No account found.";
                            break;
                        case "auth/wrong-password":
                            loginMessage.textContent = "Wrong password.";
                            break;
                        default:
                            loginMessage.textContent = "Login failed.";
                    }
                });
        });

        // Slideshow functions
        let currentSlide = 1;

        function showSignupSlides() {
            document.getElementById("signupSlides").style.display = "block";
            document.getElementById("signupOverlay").style.display = "block";
            currentSlide = 1;
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("passwordInput");
            const toggleButton = document.querySelector(".toggle-password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "🙈";
                toggleButton.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "👁️";
                toggleButton.setAttribute("aria-label", "Show password");
            }
        }

        function toggleLoginPasswordVisibility() {
            const passwordInput = document.getElementById("loginPassword");
            const toggleButton = document.querySelector(".login-toggle-password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "🙈";
                toggleButton.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "👁️";
                toggleButton.setAttribute("aria-label", "Show password");
            }
        }

        function validateFirstSlide() {
            const name = document.getElementById("nameInput").value.trim();
            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value.trim();

            if (!name || !email || !password) {
                alert("Please fill in your full name, email, and password.");
                return false;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters long.");
                return false;
            }

            return true;
        }

        function nextSlide(num) {
            if (currentSlide === 1 && num === 2 && !validateFirstSlide()) {
                return;
            }

            document.getElementById("slide" + currentSlide).classList.remove("activeSlide");
            document.getElementById("slide" + num).classList.add("activeSlide");
            currentSlide = num;
        }

        function closeSignupSlides() {
            document.getElementById("signupSlides").style.display = "none";
            document.getElementById("signupOverlay").style.display = "none";
        }

        function previewProfilePic() {
            const file = document.getElementById("profilePicInput").files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const placeholder = document.getElementById("profilePicPlaceholder");
                    placeholder.innerHTML = `<img src="${e.target.result}" alt="Profile">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function finishSignup() {
            const email = document.getElementById("emailInput").value;
            const password = document.getElementById("passwordInput").value;
            const name = document.getElementById("nameInput").value;

            if (!email || !password || !name) {
                alert("Please fill in all required fields!");
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then(() => {
                    alert("Account created! You can now log in.");
                    closeSignupSlides();
                    document.getElementById("loginEmail").value = email;
                })
                .catch(err => alert(err.message));
        }
    </script>

</body>
</html>
