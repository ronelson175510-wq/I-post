<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer Discretion Admin</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #f9fafb;
        --muted: #cbd5e1;
        --primary: #f59e0b;
        --success: #22c55e;
        --danger: #ef4444;
        --border: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #020817, #111827 60%, #0b1120);
        color: var(--text);
      }

      .panel {
        width: min(92vw, 520px);
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        padding: 28px 22px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.7rem;
      }

      p {
        color: var(--muted);
        margin: 0 0 22px;
        line-height: 1.5;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-weight: 700;
      }

      input,
      select,
      button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--border);
        font: inherit;
      }

      input,
      select {
        background: var(--panel-2);
        color: var(--text);
        padding: 12px 14px;
        margin-bottom: 18px;
      }

      button {
        background: var(--primary);
        color: #111827;
        padding: 12px 16px;
        cursor: pointer;
        border: none;
        font-weight: 800;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      .status {
        margin-top: 18px;
        min-height: 22px;
        border-radius: 8px;
        padding: 10px 12px;
        background: rgba(148, 163, 184, 0.08);
        color: var(--muted);
        font-size: 0.96rem;
      }

      .status.success {
        background: rgba(34, 197, 94, 0.12);
        color: #bbf7d0;
        border: 1px solid rgba(34, 197, 94, 0.25);
      }

      .status.error {
        background: rgba(239, 68, 68, 0.12);
        color: #fecaca;
        border: 1px solid rgba(239, 68, 68, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Viewer Discretion Admin</h1>
      <p>Manual testing tool only. This page is for staff/admin validation and should not be exposed to creators.</p>

      <label for="postId">Post ID</label>
      <input id="postId" type="number" placeholder="Enter post ID" />

      <label for="viewerDiscretion">Viewer discretion</label>
      <select id="viewerDiscretion">
        <option value="0">0 - Normal</option>
        <option value="1">1 - Restricted</option>
      </select>

      <button id="applyBtn" type="button">Apply viewer discretion</button>
      <div id="status" class="status">Waiting for input...</div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const postIdEl = document.getElementById('postId');
      const viewerDiscretionEl = document.getElementById('viewerDiscretion');
      const applyBtn = document.getElementById('applyBtn');

      function setStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = 'status';
        if (type) statusEl.classList.add(type);
      }

      applyBtn.addEventListener('click', async () => {
        const postId = String(postIdEl.value || '').trim();
        const viewerDiscretion = Number(viewerDiscretionEl.value);

        if (!postId) {
          setStatus('Please enter a post ID.', 'error');
          return;
        }

        setStatus('Updating viewer discretion...', '');

        try {
          const response = await fetch(`/api/posts/${encodeURIComponent(postId)}/viewer-discretion`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ viewer_discretion: viewerDiscretion })
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data?.error || 'Request failed');
          }

          setStatus(`Done. Post ${postId} now has viewer_discretion = ${Number(data.viewer_discretion ?? viewerDiscretion)}.`, 'success');
        } catch (error) {
          setStatus(error.message || 'Something went wrong.', 'error');
        }
      });
    </script>
  </body>
</html>
