<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chat Mini">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./app-icon.svg">
    <title>Support Page</title>
    <script src="https://unpkg.com"></script>
    <link rel="stylesheet" href="./brand-font.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
      const isLocalDevHost = ["localhost", "127.0.0.1"].includes(window.location.hostname) || window.location.hostname.endsWith(".local");
      window.BOOKME_API_BASE_URL = window.BOOKME_API_BASE_URL || (isLocalDevHost ? window.location.origin : "https://chat-mini.com");
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111111;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        a {
            color: #ffffff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #ffffff;
        }   

        p {
            color: #ffffff;
        }   

        button {
            background-color: #222222;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        button:hover {
            background-color: #333333;
        }

        input, textarea {
            background-color: white;
            color: #090909;
            border: 1px solid #ccc;
            border-radius: 22px;
            padding: 10px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        input:focus, textarea:focus {
            outline: none;
            background-color: #f7f5f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .support-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            
            color: #edf110;
        }

        .support-form button {
            align-self: flex-start;
        }

        .support-form input,
        .support-form textarea {
            width: 100%;
            box-sizing: border-box;
        }

        .support-form label {
            color: #090909;
        }
        .support-form .error {
            color: #ff0000;
        }

        .support-form .success {
            color: #00ff00;
        }

        .support-form .loading {
            color: #ffff00;
        }

        .support-form .info {
            color: #00ffff;
        }

        .support-form .warning {
            color: #ffa500;
        }

        .support-form .notice {
            color: #0000ff;
        }

        .support-form .critical {
            color: #ff00ff;
        }

        .support-form .alert {
            color: #ff4500;
        }

        .support-form .debug {
            color: #808080;
        }

        .support-form .fatal {
            color: #8b0000;
        }

        .support-form .emergency {
            color: #ff1493;
        }

        .submit-btn{
            background-color: #090909;
            color: white;
            border: none;
            border-radius: 22px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .support-form button[type="submit"]:hover {
            background-color: #333333;
        }

        .Support-live-chat-btn {
            background-color: #090909;
            color: white;
            border: none;
            border-radius: 22px;
            padding: 10px 20px;
            cursor: pointer;
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 100px;
            height: 50px;
            transform: translateX(-50%);
        }
        .Support-live-chat-btn:hover {
            background-color: #333333;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #070707;">Support</h1>
        <form class="support-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required style="resize: none;"></textarea>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <h2 style="color: #070707; left: 0; right: 0; text-align: center;"> Live chat for rapid support :</h2>
    <button class="Support-live-chat-btn" onclick="window.open('https://tawk.to/chat/6a9c86d527a69434428b7d76/1k1pmtctb?layout=modern', '_blank', 'noopener,noreferrer')" aria-label="Open live chat">
        <i class="fa-solid fa-comments fa-2xl" style="color: rgb(116, 192, 252);"></i>
    </button>

    <p style="color: #070707; left: 0; right: 0; text-align: center; margin-bottom: -120px;">Available 24/7 for your support needs.</p>


    
</body>
</html>
