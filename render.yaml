services:
  - type: web
    name: bookme
    runtime: node
    rootDir: bookme-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://www.chat-mini.com
      - key: PUBLIC_BASE_URL
        value: https://www.chat-mini.com
